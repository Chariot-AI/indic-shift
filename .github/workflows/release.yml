name: release

# Publishes to TestPyPI, then PyPI, through Trusted Publishing (no API tokens) when a version tag
# (v1.2.3) is pushed. The `testpypi` and `pypi` environments must exist in the repository settings,
# with required reviewers on `pypi`, and a trusted publisher must be configured on each index.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'Chariot-AI/indic-shift'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME"
      - run: python -m pip install build twine ".[test]"
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python tools/check_dist.py dist
      - name: SHA256SUMS
        run: |
          (cd dist && sha256sum *) > SHA256SUMS
          (cd src/indic_shift/data && sha256sum *) >> SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/
            SHA256SUMS

  testpypi:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/indic-shift
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  pypi:
    needs: testpypi
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/indic-shift
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  github-release:
    needs: pypi
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file SHA256SUMS
